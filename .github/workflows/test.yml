on: [push, pull_request]
name: Test
jobs:
  # https://github.com/mvdan/github-actions-golang
  test:
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest]
        #, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Go Fmt
      run: go fmt ./...
    - name: Test
      run: go test ./...
    - uses: actions/cache@v6
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
  # Quality gate: formatting + static analysis (mirrors scripts/quality-gate.sh).
  # https://github.com/golangci/golangci-lint-action
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.25.x
    - name: Checkout code
      uses: actions/checkout@v7
    - name: gofmt
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "gofmt: the following files need formatting (gofmt -w .):"
          echo "$unformatted"
          exit 1
        fi
    - name: go vet
      run: go vet ./...
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2