on: [push, pull_request]
name: Test
jobs:
  # https://github.com/mvdan/github-actions-golang
  test:
    strategy:
      matrix:
        go-version: [1.27.x]
        os: [ubuntu-latest]
        #, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Go Fmt
      run: go fmt ./...
    - name: Test
      run: go test ./...
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
  # Quality gate: formatting + static analysis (mirrors scripts/quality-gate.sh).
  # https://github.com/golangci/golangci-lint-action
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.x
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: gofmt
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "gofmt: the following files need formatting (gofmt -w .):"
          echo "$unformatted"
          exit 1
        fi
    - name: go vet
      run: go vet ./...
    # Keep this binary in step with the Go toolchain above: golangci-lint parses
    # the stdlib export data of the installed Go, and a release built with an
    # older Go fails to decode it ("export data version 5 is greater than
    # maximum supported version 4"). v2.15.0 is built with Go 1.27.
    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.15.0
